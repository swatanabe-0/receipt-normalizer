name: CI

# main への push と、プルリクエストのたびに、品質チェックを自動で実行する
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest

      # 記録した「実際の API の出力」を、正解データと比べる。
      # 変換・検証のロジックを変えて、間違っているのに「正常」になるものが生まれたら、ここで失敗する。
      - name: Evaluate (recorded model outputs)
        run: >
          receipt-normalizer evaluate samples/receipts
          --extractor recorded
          --recorded-dir samples/recorded/gemini-3.8-flash
          --fail-on-silent-error
